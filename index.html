            var tempDiv = document.createElement('div');
            tempDiv.innerHTML = content;
            var imgTd = tempDiv.querySelector('td img');
            if (imgTd) {
                var src = imgTd.getAttribute('src');
                if (/\.(jpg|jpeg|png|gif|bmp|webp|avif)$/i.test(src)) {
                    popup._contentNode.classList.add('media');
                    var img = popup._contentNode.querySelector('td img');
                    if (img) {
                        // If already loaded (cache), update immediately
                        if (img.complete && img.naturalHeight > 0) {
                            popup.update();
                        } else {
                            img.addEventListener('load', function() {
                                popup.update();
                            });
                            img.addEventListener('error', function() {
                                popup.update();
                            });
                        }
                    }
                } else if (/\.(mp3|wav|ogg|aac)$/i.test(src)) {
                    var audio = document.createElement('audio');
                    audio.controls = true;
                    audio.src = src;
                    imgTd.parentNode.replaceChild(audio, imgTd);
                    popup._contentNode.classList.add('media');
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else if (/\.(mp4|webm|ogg|mov)$/i.test(src)) {
                    var video = document.createElement('video');
                    video.controls = true;
                    video.src = src;
                    video.style.width = "400px";
                    video.style.height = "300px";
                    video.style.maxHeight = "60vh";
                    video.style.maxWidth = "60vw";
                    imgTd.parentNode.replaceChild(video, imgTd);
                    popup._contentNode.classList.add('media');
                    // Aggiorna il popup quando il video carica i metadati
                    video.addEventListener('loadedmetadata', function() {
                        popup.update();
                    });
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else {
                    popup._contentNode.classList.remove('media');
                }
            } else {

            }

            layer.bindTooltip((layer.feature.properties['name'] !== null?String('<div style="color: #000000; font-size: 15pt; font-weight: bold; font-family: \'Open Sans\', sans-serif;">' + layer.feature.properties['name']).replace(/\\n/g, '<br>') + '</div>':''), {permanent: true, offset: [-0, -16], className: 'css_hozpoint_3'});
            labels.push(layer);
            totalMarkers += 1;
              layer.added = true;
              addLabel(layer, i);
              i++;
        });
        resetLabels([layer_Blk2109_hoz0011_1,layer_Blk2109_hoz005_2,layer_hozpoint_3]);
        map.on("zoomend", function(){
            resetLabels([layer_Blk2109_hoz0011_1,layer_Blk2109_hoz005_2,layer_hozpoint_3]);
        });
        map.on("layeradd", function(){
            resetLabels([layer_Blk2109_hoz0011_1,layer_Blk2109_hoz005_2,layer_hozpoint_3]);
        });
        map.on("layerremove", function(){
            resetLabels([layer_Blk2109_hoz0011_1,layer_Blk2109_hoz005_2,layer_hozpoint_3]);
        });
        
        // ابزارهای میدانی حوزه ۰۰۵
        var fieldBlocks = [];
        var activeBlockIndex = -1;
        var activeBlockLayer = null;
        var gpsWatchId = null, userLatLng = null, gpsMarker = null, gpsAccuracy = null;
        var routeLayer = null, compassEnabled = false;

        function numericBlockValue(v) {
            var n = parseInt(String(v == null ? '' : v).replace(/[^\d-]/g, ''), 10);
            return isNaN(n) ? Number.MAX_SAFE_INTEGER : n;
        }
        layer_Blk2109_hoz005_2.eachLayer(function(lyr) {
            var p = lyr.feature && lyr.feature.properties ? lyr.feature.properties : {};
            fieldBlocks.push({layer:lyr, number:p.BLK_NO1405});
        });
        fieldBlocks.sort(function(a,b) {
            return numericBlockValue(a.number) - numericBlockValue(b.number);
        });

        function blockLabel(item) {
            return item && item.number != null ? String(item.number).replace(/^0+(?=\d)/,'') : 'نامشخص';
        }
        function clearActiveStyle() {
            if (activeBlockLayer && activeBlockLayer.setStyle) {
                activeBlockLayer.setStyle({
                    color:'rgba(35,35,35,1.0)', weight:1.0, fillOpacity:0
                });
            }
        }
        function setActiveBlock(index) {
            if (!fieldBlocks.length) { setFieldStatus('بلوک قابل انتخاب پیدا نشد'); return; }
            if (index < 0 || index >= fieldBlocks.length) {
                setFieldStatus('به انتهای فهرست بلوک‌ها رسیده‌اید'); return;
            }
            clearActiveStyle();
            activeBlockIndex = index;
            activeBlockLayer = fieldBlocks[index].layer;
            activeBlockLayer.setStyle({
                color:'#ff5a00', weight:3, opacity:1,
                fillColor:'#ffdf00', fillOpacity:0.35
            });
            if (activeBlockLayer.bringToFront) activeBlockLayer.bringToFront();
            map.fitBounds(activeBlockLayer.getBounds(), {padding:[35,35], maxZoom:19});
            setFieldStatus('بلوک فعال: ' + blockLabel(fieldBlocks[index]) +
                '  (' + (index+1) + ' از ' + fieldBlocks.length + ')');
        }
        function firstBlock() { setActiveBlock(0); }
        function nextBlock() {
            if (activeBlockIndex < 0) setActiveBlock(0);
            else setActiveBlock(activeBlockIndex + 1);
        }
        function zoomActiveBlock() {
            if (activeBlockLayer) map.fitBounds(activeBlockLayer.getBounds(), {padding:[35,35], maxZoom:20});
            else setFieldStatus('ابتدا یک بلوک را انتخاب کنید');
        }
        function resetActiveBlock() {
            clearActiveStyle(); activeBlockLayer = null; activeBlockIndex = -1;
            setFieldStatus('انتخاب بلوک لغو شد');
        }
        function setFieldStatus(message) {
            var el = document.getElementById('fieldStatus');
            if (el) el.textContent = message;
        }
        function setGpsButton(text) {
            var b = document.getElementById('gpsToggle');
            if (b) b.textContent = text;
        }
        function toggleGPS() {
            if (gpsWatchId !== null) {
                navigator.geolocation.clearWatch(gpsWatchId);
                gpsWatchId = null; setGpsButton('شروع GPS زنده');
                setFieldStatus('ردیابی GPS متوقف شد'); return;
            }
            if (!window.isSecureContext) {
                setFieldStatus('برای GPS صفحه باید با HTTPS باز شود'); return;
            }
            if (!navigator.geolocation) {
                setFieldStatus('مرورگر از GPS پشتیبانی نمی‌کند'); return;
            }
            setGpsButton('توقف GPS زنده');
            setFieldStatus('در حال دریافت موقعیت GPS ...');
            var firstFix = true;
            gpsWatchId = navigator.geolocation.watchPosition(function(pos) {
                userLatLng = L.latLng(pos.coords.latitude, pos.coords.longitude);
                var acc = Math.max(1, pos.coords.accuracy || 0);
                if (!gpsMarker) {
                    gpsMarker = L.circleMarker(userLatLng, {
                        radius:8, color:'#fff', weight:2, fillColor:'#087cff',
                        fillOpacity:1
                    }).addTo(map).bindPopup('موقعیت فعلی شما');
                } else gpsMarker.setLatLng(userLatLng);
                if (!gpsAccuracy) {
                    gpsAccuracy = L.circle(userLatLng, {
                        radius:acc, color:'#087cff', weight:1, fillColor:'#087cff',
                        fillOpacity:0.10
                    }).addTo(map);
                } else {
                    gpsAccuracy.setLatLng(userLatLng); gpsAccuracy.setRadius(acc);
                }
                if (firstFix) { map.setView(userLatLng, Math.max(map.getZoom(),17)); firstFix = false; }
                else map.panTo(userLatLng, {animate:true, duration:0.4});
                setFieldStatus('GPS فعال | دقت تقریبی: ' + Math.round(acc) + ' متر | ' +
                    new Date().toLocaleTimeString('fa-IR'));
            }, function(err) {
                var msg = err.code === 1 ? 'دسترسی مکان رد شده است' :
                          err.code === 2 ? 'موقعیت فعلاً در دسترس نیست' : 'زمان دریافت GPS تمام شد';
                if (gpsWatchId !== null) navigator.geolocation.clearWatch(gpsWatchId);
                gpsWatchId = null; setGpsButton('شروع GPS زنده'); setFieldStatus(msg);
            }, {enableHighAccuracy:true, maximumAge:0, timeout:30000});
        }

        function getActiveDestination() {
            if (!activeBlockLayer) { setFieldStatus('ابتدا بلوک مقصد را انتخاب کنید'); return null; }
            return activeBlockLayer.getBounds().getCenter();
        }
        function makeRoute(profile) {
            if (!userLatLng) { setFieldStatus('ابتدا GPS زنده را روشن کنید تا مبدأ مشخص شود'); return; }
            var dest = getActiveDestination(); if (!dest) return;
            if (routeLayer) { map.removeLayer(routeLayer); routeLayer = null; }
            setFieldStatus('در حال محاسبه مسیر ...');
            var service = profile === 'foot' ? 'https://routing.openstreetmap.de/routed-foot/route/v1/driving/' :
                                               'https://routing.openstreetmap.de/routed-car/route/v1/driving/';
            var url = service + userLatLng.lng + ',' + userLatLng.lat + ';' +
                      dest.lng + ',' + dest.lat + '?overview=full&geometries=geojson';
            fetch(url).then(function(r) {
                if (!r.ok) throw new Error('route');
                return r.json();
            }).then(function(data) {
                if (!data.routes || !data.routes.length) throw new Error('empty');
                routeLayer = L.geoJSON(data.routes[0].geometry, {
                    style:{color:profile === 'foot' ? '#138a45' : '#1769d2', weight:5, opacity:.85}
                }).addTo(map);
                map.fitBounds(routeLayer.getBounds(), {padding:[35,35]});
                var km = (data.routes[0].distance/1000).toFixed(2);
                var min = Math.round(data.routes[0].duration/60);
                setFieldStatus((profile === 'foot' ? 'مسیر پیاده' : 'مسیر خودرو') +
                    ' | ' + km + ' کیلومتر | حدود ' + min + ' دقیقه');
            }).catch(function() {
                setFieldStatus('محاسبه مسیر انجام نشد؛ اتصال اینترنت یا سرویس مسیریابی را بررسی کنید');
            });
        }
        function clearRoute() {
            if (routeLayer) { map.removeLayer(routeLayer); routeLayer = null; }
            setFieldStatus('مسیر پاک شد');
        }

        function updateCompass(event) {
            var heading = null;
            if (typeof event.webkitCompassHeading === 'number') heading = event.webkitCompassHeading;
            else if (typeof event.alpha === 'number') heading = 360 - event.alpha;
            if (heading === null) return;
            var arrow = document.getElementById('compassArrow');
            if (arrow) arrow.style.transform = 'rotate(' + heading + 'deg)';
        }
        function enableCompass() {
            if (!window.DeviceOrientationEvent) { setFieldStatus('قطب‌نما در این دستگاه پشتیبانی نمی‌شود'); return; }
            function listen() {
                window.addEventListener('deviceorientation', updateCompass, true);
                compassEnabled = true; setFieldStatus('قطب‌نمای دستگاه فعال شد');
            }
            if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission().then(function(state) {
                    if (state === 'granted') listen();
                    else setFieldStatus('اجازه دسترسی قطب‌نما داده نشد');
                }).catch(function(){ setFieldStatus('فعال‌سازی قطب‌نما ناموفق بود'); });
            } else listen();
        }

        var FieldControl = L.Control.extend({
            options:{position:'topright'},
            onAdd:function() {
                var div = L.DomUtil.create('div','field-tools leaflet-control');
                div.innerHTML =
                    '<div class="tool-title">راهنمای میدانی حوزه ۰۰۵</div>' +
                    '<div class="tool-grid">' +
                    '<button class="primary" id="firstBlockBtn">بلوک اول</button>' +
                    '<button id="nextBlockBtn">بلوک بعدی</button>' +
                    '<button id="zoomBlockBtn">بزرگ‌نمایی بلوک</button>' +
                    '<button id="cancelBlockBtn">لغو بلوک</button>' +
                    '<button class="wide" id="gpsToggle">شروع GPS زنده</button>' +
                    '<button id="carRouteBtn">مسیر خودرو</button>' +
                    '<button id="walkRouteBtn">مسیر پیاده</button>' +
                    '<button class="wide" id="clearRouteBtn">پاک کردن مسیر</button>' +
                    '<button class="wide" id="compassBtn">فعال‌سازی قطب‌نما</button>' +
                    '</div><div class="field-status" id="fieldStatus">آماده | تعداد بلوک‌ها: ' +
                    fieldBlocks.length + '</div>';
                L.DomEvent.disableClickPropagation(div);
                L.DomEvent.disableScrollPropagation(div);
                return div;
            },
            onAddOld: function(){}
        });
        new FieldControl().addTo(map);

        var CompassControl = L.Control.extend({
            options:{position:'bottomleft'},
            onAdd:function() {
                var d = L.DomUtil.create('div','field-compass leaflet-control');
                d.innerHTML = '<span id="compassArrow">↑</span>';
                d.title = 'جهت شمال';
                return d;
            }
        });
        new CompassControl().addTo(map);

        document.addEventListener('click', function(e) {
            var actions = {
                firstBlockBtn:firstBlock, nextBlockBtn:nextBlock,
                zoomBlockBtn:zoomActiveBlock, cancelBlockBtn:resetActiveBlock,
                gpsToggle:toggleGPS, carRouteBtn:function(){makeRoute('car');},
                walkRouteBtn:function(){makeRoute('foot');},
                clearRouteBtn:clearRoute, compassBtn:enableCompass
            };
            if (actions[e.target.id]) actions[e.target.id]();
        });
        window.addEventListener('pagehide', function() {
            if (gpsWatchId !== null && navigator.geolocation) navigator.geolocation.clearWatch(gpsWatchId);
        });
        window.addEventListener('resize', function(){ setTimeout(function(){map.invalidateSize();},150); });
        window.addEventListener('orientationchange', function(){ setTimeout(function(){map.invalidateSize();},300); });

        </script>
    </body>
</html>
